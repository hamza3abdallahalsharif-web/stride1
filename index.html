<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>STRIDE – Athletic Recovery & Compression</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0b0f17;--card:#141a26;--tx:#f2f5fa;--mu:#8b97ab;--bl:#2f8cff;--or:#ffb98a;--bd:#232c3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme=dark]){}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f7fb;--card:#fff;--tx:#0e1626;--mu:#5d6b82;--bd:#dfe6f0}}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100%}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.logo{touch-action:manipulation;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}.logo b{font-size:22px;font-style:italic;letter-spacing:1px}
.logo small{display:block;font-size:8px;letter-spacing:2px;color:var(--mu)}
.btn{background:linear-gradient(135deg,var(--bl),#1c5fd0);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;transition:.2s}.btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:#d83b4b}
.hero{padding:60px 20px 40px;text-align:center;background:radial-gradient(800px 300px at 50% 0,rgba(47,140,255,.25),transparent)}
.hero h1{font-size:clamp(30px,6vw,56px);font-style:italic}.hero h1 span{background:linear-gradient(90deg,var(--bl),var(--or));-webkit-background-clip:text;color:transparent}
.hero p{color:var(--mu);margin:12px auto 22px;max-width:520px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;padding:20px;max-width:1150px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;transition:.25s;animation:in .5s both}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.25)}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.pic{aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(145deg,#1b2740,#0d1422)}.pic img,.pic svg{width:100%;height:100%;object-fit:cover}
.bd{padding:14px}.bd h3{font-size:16px}.bd .c{color:var(--mu);font-size:13px;margin:3px 0}.pr{font-weight:700;color:var(--or);font-size:18px}
.sz{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.sz button{min-width:38px;padding:7px 9px;border-radius:9px;background:transparent;border:1px solid var(--bd)}
.sz button.on{background:var(--bl);border-color:var(--bl);color:#fff}.sz button:disabled{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center}.q{display:flex;align-items:center;border:1px solid var(--bd);border-radius:10px}.q button{background:none;width:30px;height:34px;font-size:18px}.q span{min-width:22px;text-align:center}
.stk{font-size:12px;color:var(--mu)}.low{color:#ff7a5c}
.drawer{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:var(--bg);border-left:1px solid var(--bd);z-index:50;transform:translateX(100%);transition:.3s;display:flex;flex-direction:column;padding:18px}
.drawer.open{transform:none}.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}.shade.open{display:block}
.drawer .body{flex:1;overflow:auto}.it{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:14px}
input,select{width:100%;padding:11px;border-radius:10px;background:var(--card);border:1px solid var(--bd);margin:5px 0}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:var(--bl);color:#fff;padding:12px 20px;border-radius:12px;z-index:99;transition:.3s}.toast.on{transform:translate(-50%,0)}
.admin{position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto;padding:20px;display:none}.admin.open{display:block}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{padding:9px 16px;border-radius:10px;background:var(--card);border:1px solid var(--bd)}.tabs .on{background:var(--bl);color:#fff}
.pe{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.pe label{font-size:11px;color:var(--mu)}.wrap{max-width:1000px;margin:auto;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
footer{text-align:center;color:var(--mu);padding:30px;font-size:12px}
</style></head><body>
<header><div class="logo" id="lg"><svg width="38" height="38" viewBox="0 0 40 40"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2f8cff"/><stop offset="1" stop-color="#ffb98a"/></linearGradient></defs><path d="M31 9H17c-6 0-8 7-2 9l9 3c6 2 4 10-2 10H8" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round"/><path d="M27 4l6 5-6 5" fill="none" stroke="#ffb98a" stroke-width="3" stroke-linecap="round"/></svg><div><b>STRIDE</b><small>ATHLETIC RECOVERY & COMPRESSION</small></div></div>
<button class="btn" id="cb">Cart (<span id="cn">0</span>)</button></header>
<section class="hero"><h1>Recover <span>Faster.</span> Move Better.</h1><p>Premium compression & recovery gear built for athletes. Cash on delivery across Egypt.</p><a href="#shop"><button class="btn">Shop now</button></a></section>
<div class="grid" id="shop"></div>
<footer>© 2026 STRIDE · Athletic Recovery & Compression</footer>
<div class="shade" id="sh"></div>
<aside class="drawer" id="dr"><div class="row" style="justify-content:space-between"><h2>Your cart</h2><button class="btn g" id="cx">✕</button></div><div class="body" id="cl"></div><div id="ck"></div></aside>
<div class="admin" id="ad"></div><div class="toast" id="ts"></div>
<div id="pm" style="display:none;position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.65);align-items:center;justify-content:center"><div class="card" style="padding:22px;width:min(320px,90%)"><h3 style="margin-bottom:8px">Admin login</h3><input id="pw" type="password" placeholder="Password" autocomplete="off"><div class="row" style="margin-top:8px"><button class="btn" style="flex:1" id="pgo">Enter</button><button class="btn g" onclick="$('pm').style.display='none'">Cancel</button></div></div></div>

<script>
const $=s=>document.getElementById(s),SZ=["S","M","L","XL"],PASS="STRIDE@2026@123";
const mk=(id,n,c,p,sizes,st)=>({id,n,c,p,sizes,st,rs:st,img:""});
const emptyS=n=>Object.fromEntries(SZ.map(s=>[s,n]));
const DEF=[{id:"bag",n:"Elite Bag",c:"Red",p:700,sizes:["One Size"],st:{"One Size":20},rs:20,img:"",e:"🎒"},
{id:"leg",n:"Ultra Leg Compression (pair)",c:"Black",p:1300,sizes:SZ,st:emptyS(10),rs:10,img:"",e:"🦵"},
{id:"ank",n:"Ankle Support",c:"Black",p:1000,sizes:SZ,st:emptyS(10),rs:10,img:"",e:"🦶"},
{id:"arm",n:"Elite Arm Sleeve",c:"White",p:850,sizes:SZ,st:emptyS(10),rs:10,img:"",e:"💪"},
{id:"soc",n:"Recovery Socks",c:"Black",p:650,sizes:SZ,st:emptyS(10),rs:10,img:"",e:"🧦"}];
let P=DEF,O=[],cart=[],sel={},qty={},adm=false,PW="",tab="p";
const COL={Red:"#d83b4b",Black:"#1a2233",White:"#e8edf5"};
function art(p){const c=COL[p.c]||"#2f8cff";return `<svg viewBox="0 0 200 200"><defs><linearGradient id="a${p.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f8cff" stop-opacity=".35"/><stop offset="1" stop-color="#ffb98a" stop-opacity=".25"/></linearGradient></defs><rect width="200" height="200" fill="url(#a${p.id})"/><circle cx="100" cy="100" r="62" fill="${c}" stroke="#2f8cff" stroke-width="3"/><text x="100" y="118" font-size="56" text-anchor="middle">${p.e||"🏃"}</text></svg>`}
const toast=m=>{const t=$("ts");t.textContent=m;t.className="toast on";setTimeout(()=>t.className="toast",2200)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// ---- data layer (Google Sheets via Apps Script)
const API="https://script.google.com/macros/s/AKfycbxHM1LGF4lea-kFzA-JA7D4i1_Qm6TIcFmB0qDVh3GKGtRVrER13OQ-RAErcKiq4kueiQ/exec";
const get=q=>fetch(API+"?"+q).then(r=>r.json());
const post=b=>fetch(API,{method:"POST",body:JSON.stringify(b)}).then(r=>r.json());
async function save(){try{const r=await post({action:"saveProducts",pw:PW,products:P});if(!r.ok)toast("Save failed")}catch(e){toast("Save failed")}}
async function saveO(o){try{await post({action:"setStatus",pw:PW,id:o.id,status:o.status})}catch(e){}}
async function loadP(){try{const r=await get("action=products");if(r.products&&JSON.stringify(r.products)!=JSON.stringify(P)){P=r.products;cart=cart.filter(c=>F(c.id));localStorage.setItem("stride_p",JSON.stringify(P));if(!adm)render()}}catch(e){}}
async function loadO(){try{const r=await get("action=orders&pw="+encodeURIComponent(PW));if(r.ok){O=r.orders;drawAdmin()}}catch(e){}}
async function init(){try{P=JSON.parse(localStorage.getItem("stride_p"))||DEF}catch(e){}render();loadP();setInterval(loadP,30000)}
// ---- storefront
function render(){$("shop").innerHTML=P.map((p,i)=>{const s=sel[p.id]||p.sizes.find(z=>p.st[z]>0)||p.sizes[0];sel[p.id]=s;const q=qty[p.id]||1,st=p.st[s]||0;
 return `<div class="card" style="animation-delay:${i*60}ms"><div class="pic">${p.img?`<img src="${p.img}" alt="">`:art(p)}</div><div class="bd"><h3>${esc(p.n)}</h3><div class="c">${esc(p.c)} | ${p.sizes.length>1?"all sizes":"One Size"}</div><div class="pr">${p.p} EGP</div>
 <div class="sz">${p.sizes.map(z=>`<button class="${z==s?"on":""}" ${p.st[z]<1?"disabled":""} onclick="pick('${p.id}','${z}')">${z}</button>`).join("")}</div>
 <div class="stk ${st<4?"low":""}">${st<1?"Restocking…":st<4?"Only "+st+" left":st+" in stock"}</div>
 <div class="row" style="margin-top:10px"><div class="q"><button onclick="chq('${p.id}',-1)">−</button><span>${q}</span><button onclick="chq('${p.id}',1)">+</button></div><button class="btn" style="flex:1" onclick="add('${p.id}')">Add to cart</button></div></div></div>`}).join("");
 cn()}
const F=id=>P.find(p=>p.id==id);
function pick(id,z){sel[id]=z;qty[id]=1;render()}
function chq(id,d){const p=F(id);qty[id]=Math.max(1,Math.min(p.st[sel[id]]||1,(qty[id]||1)+d));render()}
function add(id){const p=F(id),s=sel[id],q=qty[id]||1;if((p.st[s]||0)<1)return toast("Out of stock");
 const x=cart.find(c=>c.id==id&&c.s==s);const have=x?x.q:0;if(have+q>p.st[s])return toast("Max available: "+p.st[s]);
 x?x.q+=q:cart.push({id,s,q});qty[id]=1;render();toast("Added to cart ✓")}
const tot=()=>cart.reduce((a,c)=>a+F(c.id).p*c.q,0);
function cn(){$("cn").textContent=cart.reduce((a,c)=>a+c.q,0)}
function drawCart(){$("cl").innerHTML=cart.length?cart.map((c,i)=>{const p=F(c.id);return `<div class="it"><div><b>${esc(p.n)}</b><br><span class="stk">${c.s} × ${c.q}</span></div><div>${p.p*c.q} EGP <button class="btn g" style="padding:2px 8px" onclick="cart.splice(${i},1);drawCart();cn()">✕</button></div></div>`}).join(""):"<p style='color:var(--mu);margin-top:20px'>Your cart is empty.</p>";
 $("ck").innerHTML=cart.length?`<h3 style="margin:10px 0 4px">Total: ${tot()} EGP</h3><input id="on" placeholder="Full name"><input id="op" placeholder="Phone" type="tel"><input id="oa" placeholder="Address & city"><button class="btn" style="width:100%;margin-top:6px" onclick="order()">Place order (Cash on delivery)</button>`:""}
function openCart(o){$("dr").classList.toggle("open",o);$("sh").classList.toggle("open",o);if(o)drawCart()}
$("cb").onclick=()=>openCart(1);$("cx").onclick=$("sh").onclick=()=>openCart(0);
let busy=0;
async function order(){const n=$("on").value.trim(),ph=$("op").value.trim(),a=$("oa").value.trim();if(!n||ph.length<8||!a)return toast("Fill all fields");if(busy)return;busy=1;
 try{const r=await post({action:"order",name:n,phone:ph,addr:a,items:cart.map(c=>({id:c.id,s:c.s,q:c.q}))});
 if(r.products){P=r.products;localStorage.setItem("stride_p",JSON.stringify(P))}
 if(!r.ok){cart=cart.filter(c=>F(c.id));render();drawCart();toast(r.error||"Order failed")}
 else{cart=[];openCart(0);render();toast("Order placed! We'll call you ✓")}}catch(e){toast("Network error, try again")}busy=0}
// ---- hidden admin: tap the logo 5 times
let taps=0,tt;$("lg").onclick=()=>{taps++;clearTimeout(tt);tt=setTimeout(()=>taps=0,2500);if(taps>=5){taps=0;login()}};
if(location.hash=="#admin")setTimeout(login,300);
function login(){if(adm)return;$("pm").style.display="flex";$("pw").value="";setTimeout(()=>$("pw").focus(),50)}
$("pw").onkeydown=e=>{if(e.key=="Enter")$("pgo").click()};
$("pgo").onclick=async()=>{const p=$("pw").value;if(!p)return;try{const r=await get("action=login&pw="+encodeURIComponent(p));if(!r.ok)return toast("Wrong password");PW=p;adm=true;$("pm").style.display="none";$("ad").classList.add("open");drawAdmin();loadO()}catch(e){toast("Connection error")}};
function drawAdmin(){const A=$("ad");A.innerHTML=`<div class="wrap"><div class="row" style="justify-content:space-between"><h2>STRIDE Control Panel</h2><button class="btn g" onclick="adm=false;$('ad').classList.remove('open')">Close</button></div>
<div class="tabs"><button class="${tab=="p"?"on":""}" onclick="tab='p';drawAdmin()">Products</button><button class="${tab=="o"?"on":""}" onclick="tab='o';drawAdmin();loadO()">Orders (${O.length})</button></div>`+(tab=="p"?prodTab():ordTab())+"</div>"}
function prodTab(){return `<button class="btn" onclick="newP()">+ Add product</button><p class="stk" style="margin:8px 0">Changes save instantly and show to all visitors. "Restart qty" = stock a size resets to when it sells out.</p>`+P.map((p,i)=>`<div class="pe"><div><label>Name</label><input value="${esc(p.n)}" onchange="up(${i},'n',this.value)"></div><div><label>Color</label><input value="${esc(p.c)}" onchange="up(${i},'c',this.value)"></div><div><label>Price EGP</label><input type="number" value="${p.p}" onchange="up(${i},'p',+this.value)"></div><div><label>Restart qty</label><input type="number" value="${p.rs}" onchange="up(${i},'rs',+this.value)"></div>
${p.sizes.map(z=>`<div><label>Stock ${z}</label><input type="number" value="${p.st[z]}" onchange="P[${i}].st['${z}']=+this.value;save();render()"></div>`).join("")}
<div><label>Photo</label><input type="file" accept="image/*" onchange="photo(${i},this.files[0])"></div><div><label>&nbsp;</label><button class="btn r" onclick="if(confirm('Delete?')){P.splice(${i},1);save();render();drawAdmin()}">Delete</button></div></div>`).join("")}
function up(i,k,v){P[i][k]=v;save();render()}
function newP(){P.push({id:"p"+Date.now(),n:"New Product",c:"Black",p:500,sizes:SZ,st:emptyS(10),rs:10,img:""});save();render();drawAdmin()}
function photo(i,f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=300;const x=c.getContext("2d"),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,300,300);P[i].img=c.toDataURL("image/jpeg",.6);save();render();drawAdmin()};im.src=r.result};r.readAsDataURL(f)}
function ordTab(){return `<button class="btn g" onclick="csv()">Export CSV (Excel / Google Sheets)</button><table style="margin-top:10px"><tr><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr>`+O.map((o,i)=>`<tr><td>${new Date(o.t).toLocaleString()}</td><td>${esc(o.name)}<br>${esc(o.phone)}<br>${esc(o.addr)}</td><td>${o.items.map(x=>esc(x.n)+" ("+x.s+") ×"+x.q).join("<br>")}</td><td>${o.total}</td><td><select onchange="O[${i}].status=this.value;saveO(O[${i}])">${["New","Confirmed","Shipped","Delivered","Cancelled"].map(s=>`<option ${s==o.status?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")+"</table>"}
function csv(){const rows=[["Date","Name","Phone","Address","Items","Total","Status"],...O.map(o=>[new Date(o.t).toISOString(),o.name,o.phone,o.addr,o.items.map(x=>x.n+" "+x.s+" x"+x.q).join("; "),o.total,o.status])];
 const data=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+data],{type:"text/csv"}));a.download="stride-orders.csv";a.click()}
init();
</script></body></html>
